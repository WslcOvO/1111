<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>庭院守卫战</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: wooden seed tray on top, lawn canvas in the middle, wave meter below. One-screen game with a single fixed "evening garden" look. */
:root{
  --soil:#1e160e; --wood:#3d2b1c; --wood-hi:#5a412b; --wood-edge:#8b6a3d;
  --parch:#f3e4bf; --ink:#2b1d10; --dew:#5ab8f0; --leaf:#5fa63a; --warn:#d8452e; --gold:#f2c14e;
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--soil);color:var(--parch);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{margin:0 auto;max-width:min(1100px,calc((100vh - 230px) * 1.83));min-width:0;display:flex;flex-direction:column;gap:10px}
.tray{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px;border-radius:12px;
  background:linear-gradient(var(--wood-hi),var(--wood));border:2px solid #2a1d12;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.dewbox{display:flex;flex-direction:column;align-items:center;justify-content:center;width:70px;height:82px;border-radius:10px;
  background:#2a1e13;border:2px solid var(--wood-edge);font-family:var(--display)}
.dewbox svg{width:30px;height:36px}
.dewbox b{font-weight:400;font-size:22px;line-height:1.1;color:#d9f1ff;font-variant-numeric:tabular-nums}
.cards{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.card{position:relative;width:64px;height:82px;padding:3px 2px 3px;border:2px solid var(--wood-edge);border-radius:8px;
  background:linear-gradient(#f8ecca,#e5cd95);color:var(--ink);display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;cursor:pointer;overflow:hidden;font-family:var(--display);transition:transform .12s,box-shadow .12s}
.card canvas{width:56px;height:48px;display:block}
.card .nm{font-size:11px;line-height:1;white-space:nowrap}
.card .cost{font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.card .key{position:absolute;top:2px;left:4px;font-size:10px;opacity:.45}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(242,193,78,.6);transform:translateY(-3px)}
.card.poor .cost{color:#b3261e}
.card.poor canvas,.card.cooling canvas{opacity:.5;filter:grayscale(.7)}
.card .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(30,20,10,.55);pointer-events:none}
.card:hover:not(.sel){transform:translateY(-2px)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tbtn{height:40px;min-width:44px;padding:0 10px;border-radius:9px;border:2px solid var(--wood-edge);background:#2a1e13;color:var(--parch);
  font-family:var(--display);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tbtn:hover{background:#3a2a1b}
.tbtn.on{background:var(--gold);color:var(--ink);border-color:#fff3c4}
.tbtn svg{width:24px;height:24px}
.stage{position:relative;min-width:0}
#cv{display:block;width:100%;aspect-ratio:1000/545;max-width:100%;border-radius:12px;touch-action:none;cursor:pointer;background:#4e8a2c;
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.meter{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:16px;flex-wrap:wrap}
.meter .lv{color:var(--parch)}
.bar{flex:1;min-width:140px;height:16px;border-radius:8px;background:#2c2015;border:2px solid var(--wood-hi);position:relative;overflow:hidden}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6aa33d,#c6a23b,#c2563b);transition:width .4s}
.bar .flag{position:absolute;top:-1px;bottom:-1px;width:2px;background:rgba(255,240,200,.55)}
.meter .wv{font-variant-numeric:tabular-nums;color:#e9d6a8}
.hint{font-size:12.5px;color:#bba887;line-height:1.5}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:rgba(18,12,7,.78);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--parch);color:var(--ink);border-radius:16px;padding:22px 24px;width:min(580px,100%);border:3px solid var(--wood-edge);
  box-shadow:0 20px 60px rgba(0,0,0,.6);text-align:center;box-sizing:border-box;margin:auto}
.panel h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,52px);margin:0;color:#3a6b23;line-height:1.1;text-wrap:balance}
.panel h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,40px);margin:0 0 6px;line-height:1.15;text-wrap:balance}
.panel p{margin:8px 0;line-height:1.6}
.sub{color:#6b5236;font-size:15px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:16px 0 12px}
.lvbtn{border:2px solid var(--wood-edge);border-radius:10px;background:#fffaf0;color:var(--ink);padding:10px 6px;cursor:pointer;font-family:var(--display);
  display:flex;flex-direction:column;gap:2px;align-items:center}
.lvbtn b{font-weight:400;font-size:20px}
.lvbtn span{font-size:12px;color:#7a6142}
.lvbtn:hover:not(:disabled){background:#fff;border-color:#3a6b23}
.lvbtn:disabled{opacity:.45;cursor:not-allowed}
.lvbtn.done{background:#e4f0cf}
.how{text-align:left;font-size:13.5px;color:#4a3720;background:rgba(139,106,61,.12);border-radius:10px;padding:10px 14px;margin-top:6px}
.how ul{margin:4px 0;padding-left:18px}
.how li{margin:3px 0}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.big{font-family:var(--display);font-size:20px;padding:10px 22px;border-radius:12px;border:2px solid #2f5a1b;background:#4f8f2c;color:#fff;cursor:pointer}
.big.alt{background:#fffaf0;color:var(--ink);border-color:var(--wood-edge)}
.big:hover{filter:brightness(1.08)}
.foes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:14px 0 4px;text-align:left}
.foe{display:flex;gap:10px;align-items:center;background:rgba(139,106,61,.12);border-radius:10px;padding:6px 10px 6px 4px;min-width:0}
.foe canvas{width:58px;height:72px;flex:none}
.foe b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.foe em{font-style:normal;font-size:11px;background:#c2563b;color:#fff;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.foe span{font-size:12.5px;color:#5a4428;line-height:1.4}
.foe.new{background:rgba(194,86,59,.14);outline:2px solid rgba(194,86,59,.35)}
@media (max-width:640px){
  .card{width:50px;height:68px}
  .card canvas{width:44px;height:38px}
  .card .nm{font-size:9.5px}
  .card .cost{font-size:13px}
  .card .key{display:none}
  .dewbox{width:56px;height:68px}
  .dewbox svg{width:22px;height:28px}
  .dewbox b{font-size:18px}
  .tbtn{height:34px;font-size:13px;padding:0 8px;min-width:36px}
  .tbtn svg{width:20px;height:20px}
}
@media (prefers-reduced-motion:reduce){.card,.bar .fill{transition:none}.shake{animation:none}}
</style>
</head>
<body>

<div id="app">
  <div class="tray">
    <div class="dewbox" title="露珠：种植物要花费露珠">
      <svg viewBox="0 0 30 36" aria-hidden="true"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f6ff"/><stop offset="1" stop-color="#3d97dc"/></linearGradient></defs><path d="M15 2C20 11 27 17 27 24a12 12 0 0 1-24 0C3 17 10 11 15 2z" fill="url(#dg)" stroke="#2a6fa8" stroke-width="2"/><ellipse cx="10" cy="22" rx="3" ry="5" fill="#fff" opacity=".7"/></svg>
      <b id="dew">0</b>
    </div>
    <div class="cards" id="cards"></div>
    <div class="tools">
      <button class="tbtn" id="shovel" title="铲子：移除植物（快捷键 S）" aria-label="铲子"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5l6 6-2 2-1.2-1.2-5.6 5.6 1.1 1.1c.8.8.8 2 0 2.8l-1.2 1.2c-.8.8-2 .8-2.8 0L3.3 15.5c-.8-.8-.8-2 0-2.8l1.2-1.2c.8-.8 2-.8 2.8 0l1.1 1.1 5.6-5.6-1.5-1.5z" fill="#c9ced6" stroke="#55606e" stroke-width="1.2"/><path d="M15.8 8.2l-6 6" stroke="#8b6a3d" stroke-width="2"/></svg></button>
      <button class="tbtn" id="pause" title="暂停（空格）">暂停</button>
      <button class="tbtn" id="speed" title="游戏速度">1×</button>
      <button class="tbtn" id="auto" title="露珠落地后自动收集">自动收露</button>
      <button class="tbtn" id="mute" title="音效开关">音效</button>
      <button class="tbtn" id="menu" title="回到选关">选关</button>
    </div>
  </div>
  <div class="stage"><canvas id="cv" width="1000" height="545" aria-label="游戏草坪"></canvas></div>
  <div class="meter">
    <span class="lv" id="lvname">庭院守卫战</span>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
    <span class="wv" id="wv">0 / 0 波</span>
  </div>
  <div class="hint">点卡片选植物，再点草坪种下；拿同种卡片点自己的植物可升级；点击露珠收集。快捷键：1–7 选卡，S 铲子，空格暂停，Esc 取消。手机横屏玩更舒服。</div>
</div>

<div class="overlay" id="ov"><div class="panel" id="panel"></div></div>

<script>
(() => {
'use strict';
// ---------- constants ----------
const W = 1000, H = 545, GX = 80, GY = 35, CW = 100, CH = 100, COLS = 9, ROWS = 5;
const TAU = Math.PI * 2;
const PLANTS = {
  dew:   { name:'露珠草',   cost:50,  cd:7.5, hp:300,  tip:'每隔一段时间结出露珠' },
  burr:  { name:'刺果藤',   cost:100, cd:7.5, hp:300,  tip:'向前发射刺果' },
  wall:  { name:'石葫芦',   cost:50,  cd:30,  hp:4000, tip:'很硬，能挡住尸群' },
  mine:  { name:'火椒雷',   cost:25,  cd:30,  hp:300,  tip:'埋 12 秒后，碰到就炸' },
  frost: { name:'霜莓',     cost:175, cd:7.5, hp:300,  tip:'冰莓弹，让敌人变慢' },
  boom:  { name:'爆裂榴',   cost:150, cd:45,  hp:99999,tip:'种下即炸，范围 3×3' },
  twin:  { name:'双子刺果', cost:200, cd:7.5, hp:300,  tip:'一次发射两颗刺果' },
};
const ZOMBIES = {
  walker:  { name:'游尸',   hp:200,  armor:0,   speed:17, bite:60,  cost:1, tip:'被石葫芦挡久了会绕到旁边的行' },
  armor:   { name:'铁甲尸', hp:200,  armor:560, speed:16, bite:60,  cost:3, tip:'铁甲先吃伤害，打掉后才伤到本体' },
  runner:  { name:'疾行尸', hp:170,  armor:0,   speed:38, bite:60,  cost:2, tip:'专挑防守最弱的行；被挡住会立刻换行' },
  thrower: { name:'投石尸', hp:300,  armor:0,   speed:15, bite:60,  cost:3, tip:'远处停下，越过石葫芦砸后排植物' },
  shaman:  { name:'祭司尸', hp:380,  armor:0,   speed:12, bite:50,  cost:4, tip:'躲在后面，给周围尸群回血，优先打它' },
  brute:   { name:'巨尸',   hp:1500, armor:0,   speed:11, bite:200, cost:6, tip:'血厚，挑火力最猛的行硬闯' },
};
const ALL = ['dew','burr','wall','mine','frost','boom','twin'];
const LEVELS = [
  { name:'第一天 · 初来乍到', short:'初来乍到', plants:['dew','burr'], zs:{walker:1}, unlock:{}, waves:6, base:1, grow:0.6, gap:24, first:28, dew:150, tutorial:true },
  { name:'第二天 · 铁甲来袭', short:'铁甲来袭', plants:['dew','burr','wall','mine'], zs:{walker:3,armor:1.2}, unlock:{armor:2}, waves:8, base:1.5, grow:0.9, gap:24, first:22, dew:150 },
  { name:'第三天 · 疾风',     short:'疾风',     plants:['dew','burr','wall','mine','frost'], zs:{walker:3,armor:1.3,runner:1.5,thrower:0.8}, unlock:{armor:2,runner:3,thrower:5}, waves:10, base:2, grow:1.1, gap:23, first:22, dew:150 },
  { name:'第四天 · 巨影',     short:'巨影',     plants:ALL, zs:{walker:3,armor:1.6,runner:1.4,thrower:1,shaman:0.6,brute:0.7}, unlock:{armor:1,runner:2,thrower:3,shaman:4,brute:6}, waves:12, base:2.5, grow:1.25, gap:23, first:20, dew:200 },
  { name:'第五天 · 长夜',     short:'长夜',     plants:ALL, zs:{walker:2.2,armor:2.2,runner:1.8,thrower:1.2,shaman:0.9,brute:1.1}, unlock:{shaman:2,brute:3}, waves:15, base:3.5, grow:1.5, gap:22, first:20, dew:250 },
  { name:'无尽模式', short:'无尽', endless:true, plants:ALL, zs:{walker:2.2,armor:2,runner:1.8,thrower:1.2,shaman:0.9,brute:1}, unlock:{runner:2,armor:2,thrower:4,shaman:6,brute:8}, waves:Infinity, base:2.5, grow:1.35, gap:21, first:20, dew:300 },
];
const ENDLESS = LEVELS.length - 1, STORY = LEVELS.length - 1;
const UPG = { dew:true, burr:true, frost:true, twin:true, wall:true };

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rowY = r => GY + r * CH + 50;          // plant centre y
const rowGround = r => GY + r * CH + 88;     // feet line

// ---------- storage ----------
function load(key, def) { try { const v = localStorage.getItem(key); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
let unlocked = clamp(load('gg_unlocked', 1) | 0, 1, STORY);
let best = load("gg_best", 0) | 0;
let cleared = load('gg_cleared', []); if (!Array.isArray(cleared)) cleared = [];

// ---------- audio ----------
let AC = null, muted = !!load('gg_muted', false);
const lastSfx = {};
function ensureAudio() { if (muted || AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function tone(type, f1, f2, dur, vol) {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, freq) {
  const t = AC.currentTime, n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol; s.buffer = buf;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}
function sfx(k) {
  if (muted || !AC) return;
  const now = AC.currentTime; if (lastSfx[k] && now - lastSfx[k] < 0.07) return; lastSfx[k] = now;
  try {
    switch (k) {
      case 'collect': tone('sine', 880, 1500, 0.14, 0.12); break;
      case 'plant': tone('triangle', 260, 140, 0.12, 0.18); break;
      case 'shoot': tone('square', 520, 300, 0.05, 0.03); break;
      case 'hit': tone('triangle', 200, 120, 0.06, 0.08); break;
      case 'clank': tone('square', 1200, 900, 0.05, 0.04); break;
      case 'chomp': tone('sawtooth', 140, 90, 0.07, 0.05); break;
      case 'boom': noise(0.6, 0.5, 600); tone('sine', 120, 40, 0.5, 0.3); break;
      case 'roll': noise(0.9, 0.25, 300); break;
      case 'bad': tone('square', 180, 150, 0.12, 0.06); break;
      case 'wave': tone('sawtooth', 110, 90, 0.6, 0.08); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => AC && tone('triangle', f, f, 0.25, 0.15), i * 120)); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => setTimeout(() => AC && tone('sawtooth', f, f * 0.98, 0.3, 0.07), i * 180)); break;
    }
  } catch (e) {}
}

// ---------- canvas ----------
const cv = $('cv'), ctx = cv.getContext('2d');
function fitCanvas() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(300, Math.round((r.width || W) * dpr));
  const h = Math.round(w * H / W);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(cv); else window.addEventListener('resize', fitCanvas);
fitCanvas();

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- background ----------
let bg = null;
function buildBg() {
  const s = 2, b = document.createElement('canvas'); b.width = W * s; b.height = H * s;
  const c = b.getContext('2d'); c.scale(s, s); const R = mulberry(7);
  c.fillStyle = '#3f7424'; c.fillRect(0, 0, W, H);
  // porch with flagstones
  c.fillStyle = '#7d6a4d'; c.fillRect(0, 0, GX, H);
  for (let y = -10; y < H; y += 46) {
    const off = (Math.round(y / 46) % 2) * 18;
    for (let x = -20 + off; x < GX; x += 40) {
      rr(c, x + 2, y + 2, 36, 42, 8); c.fillStyle = R() < .5 ? '#b5a07a' : '#a89270'; c.fill();
      c.strokeStyle = '#6a5739'; c.lineWidth = 2; c.stroke();
    }
  }
  const g = c.createLinearGradient(GX - 14, 0, GX, 0); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
  c.fillStyle = g; c.fillRect(GX - 14, 0, 14, H);
  // lawn cells
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const x = GX + col * CW, y = GY + r * CH;
    c.fillStyle = (r + col) % 2 ? '#78b245' : '#6aa53b'; c.fillRect(x, y, CW, CH);
    const lg = c.createLinearGradient(0, y, 0, y + CH); lg.addColorStop(0, 'rgba(255,255,255,.05)'); lg.addColorStop(1, 'rgba(0,0,0,.06)');
    c.fillStyle = lg; c.fillRect(x, y, CW, CH);
    for (let i = 0; i < 7; i++) {
      const tx = x + R() * CW, ty = y + 8 + R() * (CH - 10);
      c.strokeStyle = 'rgba(40,80,20,.35)'; c.lineWidth = 1.5; c.beginPath();
      c.moveTo(tx, ty); c.lineTo(tx - 2, ty - 6); c.moveTo(tx + 2, ty); c.lineTo(tx + 3, ty - 7); c.stroke();
    }

// ---------- game state ----------
let G = null, speed = 1, autoCollect = load('gg_auto', window.innerWidth < 700);

function banner(text, dur, color) { G.banner = { text, t: 0, dur: dur || 2.6, color: color || '#ffe9a8' }; }

// ---------- lane analysis (used by the wave director and by zombies) ----------
const FIRE = { burr: 1, frost: 1.2, twin: 2 };
function laneFire(r) { let s = 0; for (const p of G.plants) if (!p.gone && p.row === r && FIRE[p.type]) s += FIRE[p.type] * (1 + 0.5 * (p.lv - 1)); return s; }

function laneTraffic(r) { let s = 0; for (const z of G.zs) if (!z.dead && z.row === r) s += ZOMBIES[z.k].cost; for (const q of G.queue) if (q.row === r) s += ZOMBIES[q.k].cost; return s; }
// how dangerous the path ahead is for a zombie at x in row r
function pathDanger(r, x) {
  let s = laneFire(r) * 1.0;
  for (const p of G.plants) if (!p.gone && p.row === r && p.x < x) { if (p.type === 'wall') s += p.hp / 1500; if (p.type === 'mine' && p.arm >= 12) s += 3; }
  if (G.boulders[r].st === 'ready') s += 0.5;
  return s;
}

function pickRow(k, load) {
  const scores = [];
  for (let r = 0; r < ROWS; r++) {
    const def = laneDefense(r), fire = laneFire(r);
    let s;
    switch (k) {
      case 'runner': s = def * 2 + load[r] * 0.5; break;                  // goes for the weakest lane
      case 'brute': s = -fire * 1.5 + load[r] * 0.8; break;               // smashes into the strongest
      case 'thrower': s = -fire + laneBlock(r) * -0.5 + load[r]; break;   // snipes lanes full of shooters
      case 'shaman': s = -load[r] * 1.2; break;                            // follows the crowd
      default: s = def * 0.9 + load[r] * 0.7;
    }
    scores.push(s + Math.random() * 1.6);
  }
  let bestR = 0; for (let r = 1; r < ROWS; r++) if (scores[r] < scores[bestR]) bestR = r;
  return bestR;
}

function startWave() {
  const L = G.L; G.wave++;
  const final = G.wave === L.waves;
  const big = G.wave % 5 === 0;
  let budget = Math.round(L.base + (G.wave - 1) * L.grow + (L.endless ? Math.pow(Math.max(0, G.wave - 10), 1.35) * 0.4 : 0));
  if (final) { budget = Math.round(budget * 2.2) + 2; banner('最后一波！', 3, '#ff9c7a'); sfx('wave'); }
  else if (G.wave === 1) { banner('尸群来了！', 2.6); sfx('wave'); }
  else if (big) { budget = Math.round(budget * 1.5); banner(L.endless ? `第 ${G.wave} 波 · 尸潮` : '尸潮将至！', 2.6, '#ffc58a'); sfx('wave'); }
  const types = Object.keys(L.zs).filter(k => G.wave >= (L.unlock[k] || 1));
  const spread = final ? 12 : big ? 9 : 6;
  const load = Array(ROWS).fill(0);
  for (let r = 0; r < ROWS; r++) load[r] = laneTraffic(r);
  const picks = [];
  while (budget > 0) {
    const avail = types.filter(k => ZOMBIES[k].cost <= budget);
    if (!avail.length) break;
    let tot = 0; for (const k of avail) tot += L.zs[k];
    let r = Math.random() * tot, k = avail[0];
    for (const kk of avail) { r -= L.zs[kk]; if (r <= 0) { k = kk; break; } }
    budget -= ZOMBIES[k].cost; picks.push(k);
  }

  picks.sort((a, b) => (a === 'shaman') - (b === 'shaman'));

  }

function spawnZombie(k, row) {
  const Z = ZOMBIES[k];
  G.zs.push({ k, row, x: W + 20 + Math.random() * 30, hp: Z.hp, maxHp: Z.hp, armor: Z.armor, maxArmor: Z.armor || 1, phase: Math.random() * TAU,
    spd: Z.speed * rand(0.9, 1.12), slow: 0, flash: 0, eating: false, dead: 0, burnt: false, chompT: 0, yOff: 0, switched: 0,
    blockT: 0, barT: 0, throwT: rand(0.5, 1.5), windup: 0, castT: 0, healT: rand(1.5, 3), armless: false });

function canUpgrade(p, type) { return p && p.type === type && UPG[type] && p.lv < 3; }

    if (type === 'wall') { occ.maxHp = P.hp * (1 + 0.5 * (occ.lv - 1)); occ.hp = occ.maxHp; }
    else occ.hp = occ.maxHp;
    G.dew -= P.cost; G.cds[type] = P.cd;

  if (type === 'dew') p.timer = 7;

  G.plants.push(p); G.grid[row][col] = p;
  G.dew -= P.cost; G.cds[type] = P.cd;

function removePlant(p) {

}

function puff(x, y, col, n) {

}
function damage(z, amt, kind) {
  if (z.dead) return;
  z.flash = 0.08; z.barT = 2.5;
  if (kind !== 'boom' && z.k !== 'brute') z.x += kind === 'frost' ? 1 : 2;   // a little knockback
  if (z.armor > 0) {
    const a = Math.min(z.armor, amt); z.armor -= a; amt -= a;

    if (z.armor <= 0) G.fx.push({ k: 'plate', x: z.x, y: rowGround(z.row) - 70, vx: 60, vy: -160, rot: 0, life: 1.1, t: 0 });
  } else if (kind !== 'boom') sfx('hit');

  if (!z.armless && z.k !== 'shaman' && z.hp > 0 && z.hp < z.maxHp * 0.5) {
    z.armless = true;
    G.fx.push({ k: 'arm', x: z.x - 30, y: rowGround(z.row) - 72, vx: rand(-40, 20), vy: -150, rot: 0, life: 1, t: 0 });
  }

}
function explode(x, y, rows, rx) {
  for (const z of G.zs) if (!z.dead && rows.includes(z.row) && Math.abs(z.x - x) < rx) damage(z, 1800, 'boom');
  G.fx.push({ k: 'boom', x, y, t: 0, life: 0.7, r: rows.length > 1 ? 150 : 75 });
  puff(x, y + 20, '#5a4128', 14); puff(x, y, '#ffb347', 12);

// ---------- update ----------
function update(dt) {
  const L = G.L;
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 30);
  for (const k in G.cds) G.cds[k] = Math.max(0, G.cds[k] - dt);
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.dur) G.banner = null; }
  if (G.over) { updateFx(dt); updateZombies(dt, true); return; }
  if (G.tips.length && G.t >= G.tips[0].t && !G.banner) { const tp = G.tips.shift(); banner(tp.text, 3, '#e7f7c8'); }

  // sky dew
  if (G.t >= G.nextSky) {
    G.nextSky = G.t + rand(8, 11);
    G.drops.push({ x: rand(GX + 30, GX + COLS * CW - 30), y: -30, ty: rand(GY + 60, GY + ROWS * CH - 30), vy: 70, vx: 0, v: 25, st: 'fall', life: 11, rest: 0 });
  }
  // waves
  if (!G.warned && G.wave === 0 && G.nextWave - G.t < 6) { G.warned = true; banner('它们快到了……', 2.2, '#e9d6a8'); }
  if (G.wave < L.waves && G.t >= G.nextWave) startWave();
  else if (G.wave > 0 && G.wave < L.waves && G.queue.length === 0 && !G.zs.some(z => !z.dead) && G.nextWave - G.t > 5) G.nextWave = G.t + 5;
  for (let i = G.queue.length - 1; i >= 0; i--) if (G.t >= G.queue[i].t) { spawnZombie(G.queue[i].k, G.queue[i].row); G.queue.splice(i, 1); }

  // plants
  for (const p of G.plants) {
    if (p.gone) continue;
    p.kick = Math.max(0, p.kick - dt * 5); p.hurt = Math.max(0, p.hurt - dt);
    switch (p.type) {
      case 'dew':
        p.timer -= dt;
        if (p.timer <= 0) {
          p.timer = 23 - (p.lv - 1) * 3;
          const v = [25, 35, 50][p.lv - 1];
          G.drops.push({ x: p.x + rand(-10, 10), y: p.y - 20, ty: p.y + rand(10, 26), vy: -220, vx: rand(-50, 50), v, st: 'pop', life: 11, rest: 0 });
        }
        break;
      case 'burr': case 'frost': case 'twin': {
        p.timer = Math.max(0, p.timer - dt);
        if (p.timer <= 0 && G.zs.some(z => !z.dead && z.row === p.row && Math.abs(z.yOff) < 50 && z.x > p.x - 10 && z.x < W - 10)) {
          p.timer = p.lv >= 3 ? 1.15 : 1.4; p.kick = 1;
          const dmg = Math.round(20 * (p.lv >= 2 ? 1.5 : 1));
          if (p.type === 'twin') {
            G.shots.push({ row: p.row, x: p.x + 24, y: p.y - 30, k: 'burr', dmg });
            G.shots.push({ row: p.row, x: p.x + 36, y: p.y - 2, k: 'burr', dmg });
          } else G.shots.push({ row: p.row, x: p.x + 34, y: p.y - 16, k: p.type, dmg, lv: p.lv });
          sfx('shoot');
        }
        break;
      }
      case 'mine':
        p.arm += dt;
        if (p.arm >= 12 && G.zs.some(z => !z.dead && z.row === p.row && Math.abs(z.yOff) < 40 && Math.abs(z.x - 20 - p.x) < 45)) { explode(p.x, p.y, [p.row], 80); removePlant(p); }
        break;
      case 'boom':

  // shots
  for (const s of G.shots) {
    s.x += 420 * dt;
    let hit = null;
    for (const z of G.zs) if (!z.dead && z.row === s.row && Math.abs(z.yOff) < 50 && s.x >= z.x - 22 && s.x <= z.x + 28 && z.x < W) { if (!hit || z.x < hit.x) hit = z; }
    if (hit) {

      s.gone = true;
      for (let i = 0; i < 5; i++) G.fx.push({ k: 'p', x: s.x, y: s.y, vx: rand(-80, 40), vy: rand(-90, 60), life: 0.3, t: 0, col: s.k === 'frost' ? '#d9f2ff' : '#a6dd62', r: 2.5 });
    }

  }
  G.shots = G.shots.filter(s => !s.gone);

  // enemy rocks
  for (const r of G.rocks) {
    r.t += dt;

      if (tgt && !tgt.gone) {

        if (tgt.hp <= 0) { removePlant(tgt); puff(tgt.x, tgt.y + 20, '#4c9a33', 8); }
      } else puff(r.tx, r.ty + 30, '#7a5a36', 5);
      sfx('hit');
    }

  G.rocks = G.rocks.filter(r => !r.gone);
  G.plants = G.plants.filter(p => !p.gone);

  updateZombies(dt, false);

  // boulders
  for (let r = 0; r < ROWS; r++) {
    const b = G.boulders[r];

  // dew first
  let best = null, bd = 44;
  for (const d of G.drops) { if (d.st === 'fly') continue; const dd = Math.hypot(d.x - p.x, d.y + 2 - p.y); if (dd < bd) { bd = dd; best = d; } }
  if (best) { collect(best); return; }
  const cell = cellAt(p.x, p.y);
  if (!cell) { G.sel = null; G.shovel = false; return; }
  const occ = G.grid[cell.row][cell.col];
  if (G.shovel) {
    if (occ) { removePlant(occ); G.plants = G.plants.filter(q => !q.gone); puff(occ.x, occ.y + 30, '#7a5a36', 8); sfx('plant'); }
    G.shovel = false; return;
  }
  if (G.sel) {
    const P = PLANTS[G.sel];
    if (occ && !canUpgrade(occ, G.sel)) { sfx('bad'); return; }
    if (G.dew < P.cost || G.cds[G.sel] > 0) { sfx('bad'); G.sel = null; return; }
    place(G.sel, cell.row, cell.col); G.sel = null; return;
  }
  G.hover = cell;
});
window.addEventListener('keydown', e => {
  if (!G || !$('ov').hidden) return;
  if (e.key >= '1' && e.key <= '9') { const k = G.L.plants[+e.key - 1]; if (k) pickCard(k); }
  else if (e.key === 's' || e.key === 'S') { G.shovel = !G.shovel; G.sel = null; }
  else if (e.key === 'Escape') { G.sel = null; G.shovel = false; }
  else if (e.key === ' ') { e.preventDefault(); setPaused(!G.paused); }
});

$('shovel').addEventListener('click', () => { if (!G || G.over) return; G.shovel = !G.shovel; G.sel = null; });
function setPaused(v) { if (!G) return; G.paused = v; $('pause').textContent = v ? '继续' : '暂停'; $('pause').classList.toggle('on', v); }
$('pause').addEventListener('click', () => { if (G && !G.over) setPaused(!G.paused); });
$('speed').addEventListener('click', () => { speed = speed === 1 ? 2 : 1; $('speed').textContent = speed + '×'; $('speed').classList.toggle('on', speed === 2); });
function syncToggles() { $('auto').classList.toggle('on', !!autoCollect); $('mute').classList.toggle('on', !muted); $('mute').textContent = muted ? '静音' : '音效'; }
$('auto').addEventListener('click', () => { autoCollect = !autoCollect; save('gg_auto', autoCollect); syncToggles(); });
$('mute').addEventListener('click', () => { muted = !muted; save('gg_muted', muted); if (!muted) ensureAudio(); syncToggles(); });
$('menu').addEventListener('click', () => { if (G && !G.over) setPaused(true); showMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.over) setPaused(true); });
syncToggles();

// ---------- overlay screens ----------
const ov = $('ov'), panel = $('panel');
function hideOverlay() { ov.hidden = true; }
function showMenu() {
  const lv = LEVELS.map((L, i) => {
    if (L.endless) {
      const locked = unlocked < 4 && !cleared.includes(2);
      return `<button class="lvbtn" data-l="${i}" ${locked ? 'disabled' : ''}><b>无尽</b><span>${locked ? '通过第三天解锁' : best ? '最佳 ' + best + ' 波' : '能撑几波？'}</span></button>`;
    }
    const locked = i + 1 > unlocked, done = cleared.includes(i);
    return `<button class="lvbtn${done ? ' done' : ''}" data-l="${i}" ${locked ? 'disabled' : ''}><b>第${'一二三四五'[i]}天</b><span>${locked ? '未解锁' : done ? L.short + ' · 已通过' : L.short}</span></button>`;
  }).join('');
  const resume = G && !G.over ? `<div class="row"><button class="big" id="resume">继续当前关卡</button></div>` : '';
  panel.innerHTML = `
    <h1>庭院守卫战</h1>
    <p class="sub">夜里爬出来的尸群想穿过草坪闯进院子。种下植物，把它们拦在篱笆外。</p>
    ${resume}
    <div class="levels">${lv}</div>
    <div class="how"><b>玩法</b><ul>
      <li>收集<b>露珠</b>（天上落下，露珠草也会结），用来种植物。</li>
      <li>先多种几株<b>露珠草</b>攒经济，再在每一行种<b>刺果藤</b>输出。</li>
      <li>拿着同种植物的卡片点自己，可以<b>升级</b>（最多 ★3）：伤害、射速、产量都会变高。</li>
      <li>尸群会<b>看你的布防</b>：哪行弱就往哪行冲，被挡住会绕路。右边的红色箭头提示下一批从哪行来。</li>
      <li>每行左边有一块<b>滚石</b>，尸群走到尽头会把它撞下来清场，但只能用一次。</li>
      <li>滚石用完后再有尸群闯过去，就输了。</li>
    </ul></div>`;
  panel.querySelectorAll('.lvbtn').forEach(b => b.addEventListener('click', () => { ensureAudio(); newGame(+b.dataset.l); }));
  const rs = $('resume'); if (rs) rs.addEventListener('click', () => { hideOverlay(); setPaused(false); });
  ov.hidden = false;
}
function showEnd(win) {
  const li = G.li, L = G.L;
  if (win) {
    if (!cleared.includes(li)) { cleared.push(li); save('gg_cleared', cleared); }
    if (unlocked < Math.min(STORY, li + 2)) { unlocked = Math.min(STORY, li + 2); save('gg_unlocked', unlocked); }
    const next = LEVELS[li + 1];
    const newPlants = next ? next.plants.filter(k => !L.plants.includes(k)).map(k => PLANTS[k].name) : [];
    const newZ = next ? Object.keys(next.zs).filter(k => !L.zs[k]).map(k => ZOMBIES[k].name) : [];
    panel.innerHTML = `<h2 style="color:#3a6b23">守住了！</h2>
      <p>${L.name} 通过。</p>
      ${newPlants.length ? `<p>解锁新植物：<b>${newPlants.join('、')}</b></p>` : ''}
      ${newZ.length ? `<p class="sub">下一关会出现：${newZ.join('、')}</p>` : ''}
      ${!next ? '<p>五天都守住了，院子安全了。</p>' : ''}
      <div class="row">${next ? `<button class="big" id="next">下一关</button>` : `<button class="big" id="again">再玩一次</button>`}<button class="big alt" id="tomenu">选关</button></div>`;
    const n = $('next'); if (n) n.addEventListener('click', () => newGame(li + 1));
    const a = $('again'); if (a) a.addEventListener('click', () => newGame(li));
  } else if (L.endless) {
    panel.innerHTML = `<h2 style="color:#a3301d">防线被突破</h2>
      <p>撑过了 <b>${Math.max(0, G.wave - 1)}</b> 波，消灭 ${G.kills} 只尸群。</p>
      <p>${G.newBest ? '新纪录！' : '最佳纪录：' + best + ' 波'}</p>
      <div class="row"><button class="big" id="retry">再来一局</button><button class="big alt" id="tomenu">选关</button></div>`;
    $('retry').addEventListener('click', () => newGame(li));
  } else {
    panel.innerHTML = `<h2 style="color:#a3301d">尸群闯进了院子……</h2>
      <p>坚持到了第 ${G.wave} / ${L.waves} 波。</p>
      <p class="sub">提示：开局先种 3–4 株露珠草，再给每行补上输出；被突破的行可以放石葫芦拖住。</p>
      <div class="row"><button class="big" id="retry">再试一次</button><button class="big alt" id="tomenu">选关</button></div>`;
    $('retry').addEventListener('click', () => newGame(li));
  }
  $('tomenu').addEventListener('click', showMenu);
  ov.hidden = false;
}
function zombieIcon(k) {
  const c = document.createElement('canvas'); c.width = 120; c.height = 150;
  const x = c.getContext('2d'); const s = k === 'brute' ? 0.62 : 0.85;
  x.translate(66, 140); x.scale(s, s); x.translate(0, -88 - GY);
  drawZombie(x, { k, row: 0, x: 0, hp: 1, maxHp: 1, armor: ZOMBIES[k].armor, maxArmor: ZOMBIES[k].armor || 1, slow: 0, flash: 0, eating: false, dead: 0, burnt: false, phase: 0.6, yOff: 0, barT: 0 }, 0);
  return c;
}
function showIntro() {
  const L = G.L;
  const prev = G.li > 0 && !L.endless ? LEVELS[G.li - 1] : null;
  const zs = Object.keys(L.zs);
  panel.innerHTML = `<h2>${L.name}</h2>
    <p class="sub">${L.endless ? '尸潮一波比一波凶，看你能撑多久。' : `共 ${L.waves} 波 · 初始露珠 ${L.dew}`}</p>
    <div class="foes" id="foes"></div>
    <div class="row"><button class="big" id="go">开始</button><button class="big alt" id="tomenu">选关</button></div>`;
  const box = $('foes');
  for (const k of zs) {
    const Z = ZOMBIES[k], isNew = prev && !prev.zs[k];
    const d = document.createElement('div'); d.className = 'foe' + (isNew ? ' new' : '');
    const info = document.createElement('div');
    info.innerHTML = `<b>${Z.name}${isNew ? '<em>新</em>' : ''}</b><span>${Z.tip}</span>`;
    d.append(zombieIcon(k), info); box.appendChild(d);
  }
  $('go').addEventListener('click', () => { ensureAudio(); hideOverlay(); });
  $('tomenu').addEventListener('click', () => { G = null; showMenu(); });
  ov.hidden = false;
}

// ---------- loop ----------
let last = performance.now(), endShown = false;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && !G.paused && ov.hidden) {
    let acc = dt * speed;
    while (acc > 1e-6) { const s = Math.min(acc, 0.025); update(s); acc -= s; }
  }
  try { render(now / 1000); } catch (e) { console.error(e); }
  if (G) {
    syncHUD();
    if (G.over && G.t >= G.endAt && ov.hidden && !endShown) { endShown = true; showEnd(G.won); }
    if (!G.over) endShown = false;
  }
  requestAnimationFrame(frame);
}
window.__garden = { get G() { return G; }, newGame };
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
